version: 2.1

workflows:
  version: 2
  build:
    jobs:
      - build:
          filters:
            branches:
              only:
                - main
      - deploy:
          requires:
            - build
          filters:
            branches:
              only:
                - main
jobs:
  build:
    working_directory: ~/ExampleApplication
    docker:
      - image: circleci/node:10.16.3
    steps:
      - checkout
      - run:
          name: update-npm
          command: sudo npm install -g npm@5
      - restore_cache:
          key: dependency-cache-{{ checksum "package-lock.json" }}
      - run:
          name: install-npm
          command: npm install
      - save_cache:
          key: dependency-cache-{{ checksum "package-lock.json" }}
          paths:
            - ./node_modules
  deploy:
    docker:
      - image: circleci/node:10.16.3
    steps:
      - run:
          name: deploy-application
          command: |
            ssh -o StrictHostKeyChecking=no "$EC2_USERNAME@$EC2_PUBLIC_DNS" '
              set -e
              repo="$HOME/MyExampleApplication"
              if git -C "$repo" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
                git -C "$repo" pull --ff-only origin main
              elif [ -e "$repo" ]; then
                echo "Deployment path exists but is not a Git checkout: $repo" >&2
                exit 1
              else
                git clone https://github.com/giridhar280902-cloud/MyExampleApplication.git "$repo"
              fi
              cd "$repo"
              bash ./deploy.sh
            '